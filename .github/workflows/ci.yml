name: JVS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install JVS with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run quality gate (ruff + pytest + hygiene)
        run: python scripts/check.py

      - name: Run examples CLI end-to-end smoke test
        run: |
          tmpdir="$(mktemp -d)"
          jvs graph init --db "$tmpdir/demo.db"
          jvs graph ingest --db "$tmpdir/demo.db" --events examples/events.jsonl --edges examples/edges.jsonl
          jvs graph stats --db "$tmpdir/demo.db"
          jvs graph why EX1 --db "$tmpdir/demo.db"
          jvs qa ask "为什么把连接池从20扩容到60？" --db "$tmpdir/demo.db" --offline
          jvs qa run --db "$tmpdir/demo.db" --questions examples/questions.jsonl --out "$tmpdir/out" --offline
          jvs eval score --answers "$tmpdir/out/answers.jsonl" --questions "$tmpdir/out/gold.jsonl"
          rm -rf "$tmpdir"
